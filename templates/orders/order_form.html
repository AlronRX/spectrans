{% extends 'base.html' %}

{% block title %}Заявка на аренду техники | СПЕЦТРАНС{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 50px auto; padding: 20px;">
    <h2 style="text-align: center; margin-bottom: 30px;">Оставить заявку</h2>
    
    <form method="post" style="background: #f9f9f9; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        {% csrf_token %} <!-- Обязательно для безопасности Django -->
        
        {% for field in form %}
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="{{ field.id_for_label }}" style="display: block; font-weight: bold; margin-bottom: 5px;">
                    {{ field.label }}
                    {% if field.field.required %}<span style="color: red;">*</span>{% endif %}
                </label>
                
                <!-- Выводим само поле. Django сам подставит нужный тег (input/select/textarea) -->
                {{ field }}
                
                {% if field.errors %}
                    <div style="color: red; font-size: 14px; margin-top: 5px;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 5px; cursor: pointer; transition: 0.3s;">
                Отправить заявку
            </button>
        </div>
    </form>
</div>
{% endblock %}
